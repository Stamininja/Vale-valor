<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vale Valor - Login</title>

    <!-- Browser Tab Favicon (Circular Crest with 'V') -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%231d1d1d'/><circle cx='50' cy='50' r='42' fill='%230b140e'/><text x='50%' y='68%' font-family='Georgia, serif' font-size='55' font-weight='bold' fill='%23ffffff' text-anchor='middle'>V</text></svg>">

    <!-- Custom Fonts for Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #0b1712;
            color: #e2f1e8;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #12241b;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #1e3a2b;
            width: 320px;
            text-align: center;
        }
        .logo-wrapper {
            margin-bottom: 20px;
        }
        .logo-wrapper svg {
            width: 130px;
            height: 130px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #1e3a2b;
            background-color: #0b1712;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #2e6345;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #3b7a57; }
        .toggle-link {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #8dae9a;
            cursor: pointer;
            text-decoration: underline;
        }
        .error { color: #ff6b6b; font-size: 0.85rem; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <!-- Vale Valor SVG Logo -->
        <div class="logo-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
                <!-- Outer Dark Grey Border -->
                <circle cx="100" cy="100" r="96" fill="#2b2b2b" />
                <!-- Inner Dark Greenish Circle -->
                <circle cx="100" cy="100" r="82" fill="#08100b" />
                
                <!-- Main Serif 'V' -->
                <text x="50%" y="110" font-family="'Playfair Display', Georgia, serif" font-size="95" font-weight="700" fill="#ffffff" text-anchor="middle">V</text>
                
                <!-- Cursive 'Vale Valor' Subtext -->
                <text x="50%" y="146" font-family="'Caveat', 'Brush Script MT', cursive" font-size="32" font-weight="600" fill="#ffffff" text-anchor="middle">Vale Valor</text>
            </svg>
        </div>

        <h2 id="form-title">Login to Vale Valor</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        
        <button id="submit-btn" onclick="handleSubmit()">Log In</button>
        <div id="error-msg" class="error"></div>

        <div class="toggle-link" id="toggle-btn" onclick="toggleMode()">
            Need an account? Create one here
        </div>
    </div>

    <script>
        let isSignUp = false;

        function toggleMode() {
            isSignUp = !isSignUp;
            document.getElementById("form-title").textContent = isSignUp ? "Create Account" : "Login to Vale Valor";
            document.getElementById("submit-btn").textContent = isSignUp ? "Sign Up" : "Log In";
            document.getElementById("toggle-btn").textContent = isSignUp ? "Already have an account? Log in" : "Need an account? Create one here";
            document.getElementById("error-msg").textContent = "";
        }

        async function handleSubmit() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const errorDiv = document.getElementById("error-msg");

            errorDiv.textContent = "";

            if (!username || !password) {
                errorDiv.textContent = "Please fill in both username and password.";
                return;
            }

            const endpoint = isSignUp ? "/signup" : "/login";

            try {
                const res = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: username, password: password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    window.location.href = "/";
                } else {
                    errorDiv.textContent = data.error || "Login failed. Check your credentials.";
                }
            } catch (err) {
                console.error("Fetch Error:", err);
                errorDiv.textContent = "Server error. Make sure app.py is running.";
            }
        }
    </script>
</body>
</html>
